name: Production smoke test

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS URL of the already-deployed production release
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run smoke -- --production
        env:
          SMOKE_URL: ${{ inputs.deployment_url }}
